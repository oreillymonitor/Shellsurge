name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test the invariant guard
        run: tools/test-check-invariants.sh

      - name: Check invariants
        run: tools/check-invariants.sh "${{ github.event.before || github.event.pull_request.base.sha }}"

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: tailscale-bridge/go.sum

      - name: Cache embedded Tailscale AAR
        id: ts-aar-cache
        uses: actions/cache@v4
        with:
          path: app/libs/tailscale-bridge.aar
          key: tsbridge-v1-${{ runner.os }}-${{ hashFiles('tailscale-bridge/**') }}

      - name: Run embedded Tailscale Go tests and build AAR
        if: steps.ts-aar-cache.outputs.cache-hit != 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          NDK_PATH=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$NDK_PATH" ]; then
            sdkmanager --install "ndk;27.2.12479018"
            NDK_PATH="$SDK_ROOT/ndk/27.2.12479018"
          fi
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_NDK_HOME="$NDK_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          cd tailscale-bridge
          go mod download
          go test -v ./...
          mkdir -p ../app/libs
          gomobile bind -v -target=android/arm64,android/amd64 -androidapi 31 -javapkg=io.github.lordofpolls.shellwave.tailscale -ldflags="-s -w" -o ../app/libs/tailscale-bridge.aar .
          test -s ../app/libs/tailscale-bridge.aar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and lint
        run: ./gradlew --no-daemon testFossDebugUnitTest lintFossDebug

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleFossDebug

      - name: Verify Release Build (R8)
        run: ./gradlew --no-daemon assembleFossRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shellsurge-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
