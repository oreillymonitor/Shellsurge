name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test the invariant guard
        run: tools/test-check-invariants.sh

      - name: Check invariants
        run: tools/check-invariants.sh "${{ github.event.before || github.event.pull_request.base.sha }}"

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and lint
        run: ./gradlew --no-daemon testFossDebugUnitTest lintFossDebug

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleFossDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shellwave-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$(tools/version.sh)"
          TAG="v${name}"
          APK=$(find app/build/outputs/apk/foss/debug -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "No debug APK found" >&2
            exit 1
          fi
          ASSET="$RUNNER_TEMP/shellsurge-${name}.apk"
          cp "$APK" "$ASSET"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          {
            printf 'Automated build from `master` (`%s`).\n\n' "${GITHUB_SHA::7}"
            printf '### Latest Change\n%s\n\n' "$COMMIT_MSG"
            printf '> Signed with the repository debug keystore for seamless in-place updates over existing CI builds.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "ShellSurge $TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "ShellSurge $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi
